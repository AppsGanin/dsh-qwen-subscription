version: 2
updates:
  # Runtime and dev dependencies (semantic-release tooling, react for tests).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # v10 needs conventional-changelog-writer@9, while semantic-release
      # bundles writer 8; the release notes step breaks on the mismatch.
      - dependency-name: conventional-changelog-conventionalcommits
        update-types: [version-update:semver-major]
      # semantic-release 26 requires Node >= 26.13; CI runs Node 20 and 24.
      - dependency-name: semantic-release
        update-types: [version-update:semver-major]
  # GitHub Actions used by CI and Release.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
